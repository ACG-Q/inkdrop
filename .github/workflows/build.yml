name: Build & Release

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup keystore
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding keystore from secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/release-key.jks"
          else
            echo "No KEYSTORE_BASE64 secret found, generating temporary keystore..."
            keytool -genkeypair -v \
              -keystore "$HOME/release-key.jks" \
              -alias inkdrop \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=CI,OU=CI,O=CI,L=Unknown,ST=Unknown,C=CN"
          fi
          echo "KEYSTORE_FILE=$HOME/release-key.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD:-android}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${KEY_ALIAS:-inkdrop}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${KEY_PASSWORD:-android}" >> $GITHUB_ENV
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}

      - name: Find APKs
        id: find-apk
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "release_apk=app/build/outputs/apk/release/app-release.apk" >> $GITHUB_OUTPUT
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            echo "release_apk=app/build/outputs/apk/release/app-release-unsigned.apk" >> $GITHUB_OUTPUT
          fi
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "debug_apk=app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_OUTPUT
          fi

      - name: Upload Debug APK to Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: InkDrop-Wallpaper-debug
          path: ${{ steps.find-apk.outputs.debug_apk }}
          retention-days: 30

      - name: Upload Release APK to Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: InkDrop-Wallpaper-release
          path: ${{ steps.find-apk.outputs.release_apk }}
          retention-days: 30
